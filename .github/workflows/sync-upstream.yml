name: Sync upstream PingMe

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch upstream PingMe.js
        run: |
          mkdir -p upstream
          curl -fsSL https://raw.githubusercontent.com/ZenmoFeiShi/Qx/refs/heads/main/PingMe.js -o upstream/PingMe.js

      - name: Build Surge wrapper
        run: |
          python3 scripts/build_pingme_surge.py

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream/PingMe.js PingMe.surge.js
          git commit -m "chore: sync upstream PingMe.js"
          git push
